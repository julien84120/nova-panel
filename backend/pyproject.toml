[project]
name = "novapanel-backend"
version = "0.7.0"
description = "NovaPanel API — Proxmox VE + Docker (SSH) dashboard backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "proxmoxer>=2.2",
    "requests>=2.32",
    "docker>=7.1",
    "paramiko>=3.5",
    "argon2-cffi>=23.1",
]

[project.scripts]
novapanel = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
