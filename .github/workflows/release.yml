name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  tarball:
    name: Release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Assemble archive
        run: |
          set -eux
          V="${GITHUB_REF_NAME}"
          D="novapanel-$V"
          mkdir -p "$D/frontend"
          cp -a backend deploy install.sh docker-compose.yml Dockerfile LICENSE README.md "$D/"
          cp -a frontend/dist "$D/frontend/dist"
          rm -rf "$D/backend/tests" "$D/backend/.venv" "$D/deploy/ssh/"*.pub
          tar -czf "$D.tar.gz" "$D"
          sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" novapanel-*.tar.gz novapanel-*.tar.gz.sha256 \
            --title "NovaPanel $GITHUB_REF_NAME" --generate-notes

  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
